name: brand-contracts
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/root/.composer/cache
      - coverage-data:/app/coverage
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
    command: ["tail", "-f", "/dev/null"]
    networks:
      - brand-contracts-network

volumes:
  composer-cache:
    driver: local
  coverage-data:
    driver: local

networks:
  brand-contracts-network:
    driver: bridge
